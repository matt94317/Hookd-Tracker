services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: hookd
      POSTGRES_PASSWORD: hookd
      POSTGRES_DB: hookd_tracker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "5001:5000"
    environment:
      FLASK_APP: "app:create_app"
      FLASK_DEBUG: "1"
      DATABASE_URL: "postgresql://hookd:hookd@db:5432/hookd_tracker"
    volumes:
      - ./backend:/app
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: "http://localhost:5001"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
